name: release

# Publishes a version of the Go SDK. Go modules are published by tag: the proxy
# (proxy.golang.org) picks up the tag on its own on the first request. Runs
# manually only, with the version (vMAJOR.MINOR.PATCH) chosen at run time.
# Reruns the checks and the examples against the sandbox before creating the
# tag and the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The version is vMAJOR.MINOR.PATCH
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid version: $VERSION (use something like v1.0.0)" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5' # pinned: oapi-codegen v2.8.2 requires Go 1.25+, and the generated code goes through that toolchain's gofmt
      - name: The tag does not exist yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists" >&2
            exit 1
          fi
      - run: make check-generated
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Examples against the sandbox before publishing
        env:
          INFI_SECRET_KEY: ${{ secrets.INFI_SANDBOX_SECRET_KEY }}
        run: go run ./examples/run-all
      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "infi-go $VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
