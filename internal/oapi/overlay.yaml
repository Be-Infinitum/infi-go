# Renames contract types that would collide with the handwritten layer.
overlay: 1.0.0
info:
  title: Go names
  version: 1.0.0
actions:
  # infi.Error is the SDK error (errors.go); the contract envelope becomes ErrorResponse.
  - target: $.components.schemas.Error
    update:
      x-go-name: ErrorResponse
  # The contract (OpenAPI 3.1) declares enums without `type`; without it oapi-codegen
  # generates interface{}. All untyped enums in the contract are strings.
  - target: $..[?(@.enum && !@.type)]
    update:
      type: string
